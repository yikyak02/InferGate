apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-a
spec:
  # Each configured backend represents one process, with its own capacity budget.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend-a
  template:
    metadata:
      labels:
        app: backend-a
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: simulator
          image: memory-inference-gateway:local
          imagePullPolicy: IfNotPresent
          command: ["/simulator"]
          args: ["-listen", ":9001", "-capacity", "512", "-token-delay", "2ms"]
          ports:
            - name: http
              containerPort: 9001
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # Injected /health failures must not restart the simulator.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: backend-a
spec:
  selector:
    app: backend-a
  ports:
    - name: http
      port: 9001
      targetPort: http
---
