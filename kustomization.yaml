apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: memory-gateway
resources:
  - k8s/namespace.yaml
  - k8s/gateway.yaml
  - k8s/backends.yaml
  - k8s/monitoring.yaml
configMapGenerator:
  - name: gateway-config
    files:
      - gateway.json=configs/compose.json
  - name: prometheus-config
    files:
      - monitoring/prometheus.yml
      - monitoring/alerts.yml
  - name: grafana-datasource
    files:
      - monitoring/grafana/provisioning/datasources/prometheus.yaml
  - name: grafana-provider
    files:
      - monitoring/grafana/provisioning/dashboards/default.yaml
  - name: grafana-dashboard
    files:
      - monitoring/grafana/dashboards/gateway.json
